name: Build SketchLiftAR APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'build_payload/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild project archive
        run: |
          cat build_payload/part00.b64 build_payload/part01.b64 build_payload/part02.b64 build_payload/part03.b64 build_payload/part04.b64 > project.b64
          base64 -d project.b64 > SketchLiftAR-android-mvp.zip
          unzip -tq SketchLiftAR-android-mvp.zip

      - name: Extract project
        run: unzip -q SketchLiftAR-android-mvp.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/SketchLiftAR
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage APK
        run: cp build-src/SketchLiftAR/app/build/outputs/apk/debug/app-debug.apk SketchLiftAR-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SketchLiftAR-debug-apk
          path: SketchLiftAR-debug.apk
          if-no-files-found: error
